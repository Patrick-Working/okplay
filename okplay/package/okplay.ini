[okplay]
; ---------------------------------------------------------------------------
; Classic Netplay for AoE2 - settings. Self-hosting? Change the names and the
; server/key below, then run the launcher's Install again (see SELF-HOSTING.md).
; ---------------------------------------------------------------------------

; Launcher window + shortcut name
brand=Oldkid.net Online Play
; The two entries players pick in the game's Multiplayer screen
online_name=Oldkid.net Online Play
lan_name=Oldkid.net LAN Play

; Room server for Online Play (okplay.php). LAN Play never uses it.
server=https://oldkid.net/aoe2net/okplay.php
; Must match APP_KEY in okplay.php. Not a password - just keeps random traffic out.
key=okp_7Qm2xV9rLs4Hd8Wn

; 3 = verbose diagnostics while we test. 2 = normal. 0 = off.
loglevel=3
; per-player stats line in the log every N ms (0 = off)
stats_ms=10000
; write a crash dump (.dmp) next to the logs if the game crashes
crashdump=1
