[okplay]
; ---------------------------------------------------------------------------
; Classic Netplay for AoE2 (drop-in) - settings. This file is optional: delete it
; and sensible defaults are used. Self-hosting? Change the names and server/key.
; ---------------------------------------------------------------------------

; Which multiplayer the game uses:
;   all     = one list: {{BRAND}}'s Online Play and LAN Play first, then the
;             classic Windows connections (TCP/IP, IPX, Modem, Serial). Pick a
;             classic one and the game runs on Windows' own DirectPlay, so it plays
;             with people who don't have {{BRAND}}. Without the Windows DirectPlay
;             feature only {{BRAND}}'s two are listed.
;   oldkid  = {{BRAND}}'s two connections only
;   windows = classic Windows DirectPlay only, as if {{BRAND}} weren't here
;   ask     = ask every time the game starts: oldkid or windows
mode=all
; A game started by a DirectPlay lobby program always gets Windows' DirectPlay
; (the lobby hands it the connection through Windows). 0 = never switch.
lobby_auto=1
; The name in the "ask" box and in messages
brand={{BRAND}}

; Game passwords (Online/LAN Play): ask = when you host, a box asks for an
; optional password (empty = anyone can join); off = never ask, host open
; games. Joining a game that has one always asks for it. Only a scrambled form
; of a password ever leaves your PC.
use_password=ask

; The boxes (password, update notice, messages): auto = styled like the game's
; own dialogs in Age of Empires II, plain Windows dialogs in any other game;
; 0 = always styled; 1 = always plain (title bar, standard buttons and font).
simple_textboxes=auto

; Newer versions: when one is out, a box offers the download the first time
; you use {{ONLINE}} (once per game, never blocking). 0 = never ask.
; "Don't remind me about this version" in the box writes update_seen=<version>.
update_check=1

; Reports to oldkid.net (never player names, chat or addresses; kept 90 days).
; crash_reports: after the game crashes, the next time you open Multiplayer a box
;   asks whether to send a crash report (with a button to read it first).
;   ask = ask each time, always = send without asking, never = don't keep one.
; connection_reports: one short line per game about how well it connected.
;   ask = you're asked once after your first game (your answer is saved here),
;   yes = send, no = don't.
crash_reports=ask
connection_reports=ask

; The two entries in the game's Multiplayer connection list
online_name={{ONLINE}}
lan_name={{LAN}}
; mode=oldkid only: 1 = also list Windows' TCP/IP, IPX, Modem and Serial, run by
; {{BRAND}}'s DirectPlay (diagnostics only: for real classic games use mode=all)
show_windows_connections=0

; Games with a FIXED connection list (e.g. Midtown Madness: Zone, IPX, TCP/IP,
; Serial, Modem - never enumerated) can't show {{ONLINE}} / {{LAN}}. Hand them
; one of those entries instead: online, lan, or ask (a box offers Online Play /
; LAN Play / Windows' own the first time the game picks it). Empty = Windows'.
; Use the dead ones - classic_modem=online and classic_serial=lan - so TCP/IP
; and IPX stay Windows' own for playing with plain-Windows machines. Age of
; Empires II lists connections properly and needs none of these.
classic_tcpip=
classic_ipx=
classic_serial=
classic_modem=
; 1 = the game's own desktop-resolution switch (ChangeDisplaySettings) is
; answered "done" without changing anything, and the game is told it got the
; mode it asked for; pair it with a graphics wrapper (dgVoodoo2) that scales
; the picture. Only for games that use nothing else to check the mode (Midtown
; Madness also checks through DirectDraw and quits - leave it 0 there). The
; desktop mode is restored when the game exits in any case. Default 0.
keep_desktop_mode=0

; Game fixes: a few games' own exe keeps them from reaching DirectPlay (e.g. the
; 2023 GOG Necrodome, whose Network Game list is always empty). The fix is made in
; memory only, never to the exe on disk, and only when the exe matches the exact
; file it was made for, byte for byte - an original or any other version is left
; alone (the log says so). 1 = on (default), 0 = off.
game_fixes=1
; 1 = a game that creates DirectPlay through COM (CoCreateInstance) gets this
; DLL too, instead of Windows' own; 0 = leave COM creation to Windows. Default 1.
com_redirect=1

; Room server for Online Play (okplay.php). LAN Play never uses it.
server={{SERVER}}
; Must match APP_KEY in okplay.php. Not a password - just keeps random traffic out.
key={{KEY}}

; Diagnostics: trace=1 logs every DirectPlay call the game makes, with its
; result, to the session log (large logs; for comparing a classic connection
; with {{ONLINE}} / {{LAN}} in the same game). 0 = off.
trace=0

; Intro movies: 1 = play them, 0 = skip them (the game starts ~1.5 minutes sooner)
intro=1
; 1 = decode them with okindeo.dll (next to dplayx.dll) so they have a picture;
; 0 = leave it to Windows (no picture on Windows 7 and later, sound only)
videos=1

; How game messages travel. The HOST decides for everyone in its game (joiners follow):
;   udp           Fast: plain UDP (DirectPlay's own messages are always resent until they arrive)
;   udp+reliable  DirectPlay-style (the default): messages the game marks "guaranteed" are resent
;                 until they arrive, the rest stay fast - what Windows' own DirectPlay does
;   reliable      All reliable: nothing lost or reordered; can stutter on a bad connection
transport=udp+reliable
; Advanced: send this PC's own messages one way whatever the host chose (empty = follow the host)
transport_force=

; How long another player may go silent (internet outage, Wi-Fi reconnect) before they are
; dropped from the game, in seconds. 15 = what Windows' own DirectPlay does. Up to 120 keeps
; players through longer outages - the game waits for them meanwhile.
drop_after=15

; Warn before joining a host whose game exe is a different version from yours (a patch or
; mod usually means the game goes out of sync): ask = a box with Join anyway / Cancel, off = never
build_check=ask

; 3 = verbose diagnostics while we test. 2 = normal. 0 = off.
loglevel=3
; per-player stats line in the log every N ms (0 = off)
stats_ms=10000
; write a crash dump (.dmp) next to the logs if the game crashes
crashdump=1
